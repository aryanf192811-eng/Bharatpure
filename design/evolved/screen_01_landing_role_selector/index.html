</div>
</div>
<h1 class="font-display text-3xl text-white tracking-tight font-semibold">BharatPure</h1>

        </p>
<!-- Trust Pill -->

<div aria-label="BharatPure Roles" class="grid grid-cols-2 gap-2.5" role="radiogroup">
<!-- Role 1: Farmer / FPO (Active Default) -->
<button aria-checked="true" class="role-card text-left p-3 rounded bg-primary-50 shadow-sm flex flex-col justify-between transition-all duration-200 relative group text-earth-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" data-label="Continue as Farmer / FPO" data-role="farmer" role="radio" type="button">
<div class="flex items-start justify-between w-full mb-1.5">
<span class="text-2xl leading-none">🌾</span>
<span class="role-badge font-mono text-xs px-1.5 py-0.5 rounded-sm bg-primary-800 text-white font-medium tracking-wider uppercase">
                Active
              </span>
</div>
<div>
<div class="font-body text-lg text-primary-900 font-semibold group-hover:text-primary-800">Farmer / FPO</div>
<p class="font-body text-xs text-earth-700 mt-1 leading-snug font-normal">
                List harvest, guaranteed contracts &amp; fair prices
              </p>
</div>
</button>
<!-- Role 2: Consumer -->
<button aria-checked="false" class="role-card text-left p-3 rounded bg-earth-100 shadow-sm flex flex-col justify-between transition-all duration-200 group text-earth-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" data-label="Continue as Consumer" data-role="consumer" role="radio" type="button">
<div class="flex items-start justify-between w-full mb-1.5">
<span class="text-2xl leading-none">🛒</span>
<span class="role-badge hidden font-mono text-xs px-1.5 py-0.5 rounded-sm bg-primary-800 text-white font-medium tracking-wider uppercase">
                Active
              </span>
</div>
<div>
<div class="font-body text-lg text-earth-900 font-semibold group-hover:text-primary-800">Consumer</div>
<p class="font-body text-xs text-earth-700 mt-1 leading-snug font-normal">
                Traceable, single-origin NABL certified food
              </p>
</div>
</button>
<!-- Role 3: Bulk Buyer -->
<button aria-checked="false" class="role-card text-left p-3 rounded bg-earth-100 shadow-sm flex flex-col justify-between transition-all duration-200 group text-earth-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" data-label="Continue as Bulk Buyer" data-role="buyer" role="radio" type="button">
<div class="flex items-start justify-between w-full mb-1.5">
<span class="text-2xl leading-none">🏢</span>
<span class="role-badge hidden font-mono text-xs px-1.5 py-0.5 rounded-sm bg-primary-800 text-white font-medium tracking-wider uppercase">
                Active
              </span>
</div>
<div>
<div class="font-body text-lg text-earth-900 font-semibold group-hover:text-primary-800">Bulk Buyer</div>
<p class="font-body text-xs text-earth-700 mt-1 leading-snug font-normal">
                Predictable sourcing, escrow &amp; quality grades
              </p>
</div>
</button>
<!-- Role 4: Logistics -->
<button aria-checked="false" class="role-card text-left p-3 rounded bg-earth-100 shadow-sm flex flex-col justify-between transition-all duration-200 group text-earth-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" data-label="Continue as Logistics" data-role="logistics" role="radio" type="button">
<div class="flex items-start justify-between w-full mb-1.5">
<span class="text-2xl leading-none">🚚</span>
<span class="role-badge hidden font-mono text-xs px-1.5 py-0.5 rounded-sm bg-primary-800 text-white font-medium tracking-wider uppercase">
                Active
              </span>
</div>
<div>
<div class="font-body text-lg text-earth-900 font-semibold group-hover:text-primary-800">Logistics</div>
<p class="font-body text-xs text-earth-700 mt-1 leading-snug font-normal">
                Optimized routes, cold-chain IoT monitoring
              </p>
</div>
</button>
<!-- Role 5: Government / Admin (Span Full Width) -->
<button aria-checked="false" class="role-card col-span-2 text-left p-3.5 rounded bg-earth-100 shadow-sm flex items-center justify-between transition-all duration-200 group text-earth-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" data-label="Continue as Government / Admin" data-role="gov" role="radio" type="button">
<div class="flex items-center gap-3">
<span class="text-2xl">🏛️</span>
<div>
<div class="font-body text-lg text-earth-900 font-semibold group-hover:text-primary-800">Government / Admin</div>
<p class="font-body text-xs text-earth-700 mt-0.5 leading-snug font-normal">
                  DPI, AgriStack integration &amp; market intelligence
                </p>
</div>
</div>
<span class="role-badge hidden font-mono text-xs px-2 py-0.5 rounded-sm bg-primary-800 text-white font-medium tracking-wider uppercase">
              Active
            </span>
</button>
</div>
<!-- Section 4: Primary CTA Button -->
<button class="w-full mt-2 py-3.5 px-5 rounded bg-primary-800 text-white font-body text-base font-semibold flex items-center justify-center gap-2 shadow-md hover:bg-primary-700 active:scale-[0.99] transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" id="roleCtaBtn" type="button">
<span id="roleCtaText">Continue as Farmer / FPO</span>
<span class="material-symbols-outlined text-gold-100 text-xl">arrow_forward</span>
</button>
<!-- Section 5: Bottom Sign-in Link -->
<div class="flex items-center justify-center pt-2">
<p class="font-body text-sm text-earth-700 font-normal">
            Already registered? 
            <button class="text-primary-700 font-semibold hover:underline underline-offset-2 ml-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-800 focus-visible:ring-offset-2" type="button">
              Sign in
            </button>
</p>
</div>
</section>
<!-- Trust Badges Strip -->
<footer class="mt-6 flex items-center justify-around py-3 px-4 rounded-md bg-white/60 backdrop-blur-sm shadow-sm text-earth-700">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary-700 text-sm">security</span>
<span class="font-mono text-xs font-medium tracking-wider uppercase">256-Bit Escrow</span>
</div>
<div class="w-1 h-1 rounded-full bg-earth-200"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-gold-800 text-sm">science</span>
<span class="font-mono text-xs font-medium tracking-wider uppercase">NABL Lab Tested</span>
</div>
<div class="w-1 h-1 rounded-full bg-earth-200"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary-700 text-sm">hub</span>
<span class="font-mono text-xs font-medium tracking-wider uppercase">AgriStack DPI</span>
</div>
</footer>
</div>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.role-card');
    const ctaBtn = document.getElementById('roleCtaBtn');
    const ctaText = document.getElementById('roleCtaText');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Reset all
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-primary-50', 'shadow-md');
          c.classList.add('bg-earth-100', 'shadow-sm');
          const badge = c.querySelector('.role-badge');
          if (badge) badge.classList.add('hidden');
        });

        // Activate selected
        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-earth-100', 'shadow-sm');
        card.classList.add('bg-primary-50', 'shadow-md');
        
        const badge = card.querySelector('.role-badge');
        if (badge) badge.classList.remove('hidden');

        // Update CTA text
        const label = card.getAttribute('data-label') || 'Continue';
        if (ctaText) ctaText.textContent = label;
      });
    });

    if (ctaBtn) {
      ctaBtn.addEventListener('click', () => {
        const activeCard = document.querySelector('.role-card[aria-checked="true"]');
        const role = activeCard ? activeCard.getAttribute('data-role') : 'farmer';
        
        // Haptic feedback pulse on mobile where supported
        if (navigator.vibrate) {
          navigator.vibrate(15);
        }
      });
    }
  })();
</script></main></body></html>
